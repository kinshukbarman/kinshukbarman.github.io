<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cookies Consent</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="cookie-container">
    <img src="hand.png" alt="Hand holding card" class="hand">

    <!-- Cookie message card -->
    <div class="cookie-card" id="cookieCard">
      <h2>COOKIES</h2>
      <p>WE USE COOKIES TO IMPROVE YOUR EXPERIENCE!</p>
      <div class="btns">
        <button class="accept" id="acceptBtn">ACCEPT</button>
        <button class="decline">DECLINE</button>
      </div>
    </div>

    <!-- Success tick card -->
    <div class="cookie-success" id="cookieSuccess">
      <div class="tick">
        <!-- Inline SVG for perfect blue tick -->
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 52 52">
          <circle cx="26" cy="26" r="25" fill="#3399ff" stroke="#000" stroke-width="3"/>
          <path fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"
            d="M14 27l8 8 16-16"/>
        </svg>
      </div>
      <p>THANK YOU!</p>
    </div>
  </div>

  <script>
    const acceptBtn = document.getElementById("acceptBtn");
    const card = document.getElementById("cookieCard");
    const success = document.getElementById("cookieSuccess");

    acceptBtn.addEventListener("click", () => {
      card.classList.add("hide");
      success.classList.add("show");
    });
  </script>
</body>
</html>
