  <style>
    body, html {
      margin: 0;
      padding: 0;
      height: 100%;
      background: white;
      color: #111;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    .container {
      text-align: center;
      flex-grow: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .flash-text {
      font-size: 3.5rem;
      font-weight: 900;
      letter-spacing: 3px;
      animation: flashlight 4.5s ease forwards;
    }

    /* 3 flashes: red, green, blue - high contrast, then fade out */
    @keyframes flashlight {
      0% {
        color: #111;
        text-shadow: none;
        opacity: 0;
      }
      /* 1st flash - Red */
      10% {
        opacity: 1;
        color: #ff0000;
        text-shadow:
          0 0 10px #ff0000,
          0 0 20px #ff0000,
          0 0 30px #ff4444,
          0 0 40px #ff4444;
      }
      25% {
        color: #111;
        text-shadow: none;
        opacity: 1;
      }
      /* 2nd flash - Green */
      35% {
        opacity: 1;
        color: #00cc00;
        text-shadow:
          0 0 10px #00cc00,
          0 0 20px #00cc00,
          0 0 30px #44ff44,
          0 0 40px #44ff44;
      }
      50% {
        color: #111;
        text-shadow: none;
        opacity: 1;
      }
      /* 3rd flash - Blue */
      60% {
        opacity: 1;
        color: #0066ff;
        text-shadow:
          0 0 10px #0066ff,
          0 0 20px #0066ff,
          0 0 30px #4488ff,
          0 0 40px #4488ff;
      }
      75% {
        color: #111;
        text-shadow: none;
        opacity: 1;
      }
      100% {
        opacity: 0;
      }
    }

    .under-construction, .project-x {
      font-size: 1.6rem;
      font-weight: 600;
      color: #333;
      opacity: 0;
      animation-fill-mode: forwards;
      animation-timing-function: ease-in-out;
    }

    .under-construction {
      animation-name: fadeIn;
      animation-duration: 1.5s;
      animation-delay: 4.6s;
    }

    .project-x {
      animation-name: fadeIn;
      animation-duration: 1.5s;
      animation-delay: 5.5s;
    }

    @keyframes fadeIn {
      to {
        opacity: 1;
      }
    }

    footer {
      font-size: 0.9rem;
      color: #777;
      padding: 12px 0;
      text-align: center;
      width: 100%;
      border-top: 1px solid #eee;
      background: #fff;
      flex-shrink: 0;
      position: relative;
      bottom: 0;
    }
  </style>
